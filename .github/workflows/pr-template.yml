name: PR Template

# Makes sure every new pull request description contains the PR template.
#
# GitHub already pre-fills .github/pull_request_template.md when a PR is opened in the
# browser. This workflow covers the cases where that doesn't happen: PRs opened from the
# CLI or API, or PRs where the contributor cleared the description. If the template is
# missing, it is added (below the contributor's own text, if they wrote any).
#
# SECURITY: this uses `pull_request_target` so it can edit PRs that come from forks
# (the normal `pull_request` token is read-only for forks). That is only safe because the
# job NEVER checks out or runs code from the pull request. It only reads the template
# from the base branch and updates the PR description. Do not add a checkout of the PR
# head or run any PR code in this workflow.
#
# Like all pull_request_target workflows, it runs from the default branch (main).
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-template:
    name: Add PR template if missing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add template to description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Bots (Dependabot etc.) write their own descriptions.
            if (pr.user.type === 'Bot') {
              core.info('PR opened by a bot, skipping.');
              return;
            }

            // Read the template from the BASE branch (trusted), never from the PR.
            const TEMPLATE_PATH = '.github/pull_request_template.md';
            let template;
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: TEMPLATE_PATH, ref: pr.base.ref,
              });
              template = Buffer.from(data.content, 'base64').toString('utf8').trim();
            } catch (err) {
              if (err.status === 404) {
                core.warning(`${TEMPLATE_PATH} was not found on ${pr.base.ref}, nothing to add.`);
                return;
              }
              throw err;
            }

            // Is the template already in the description? Look for the hidden marker
            // comment, or for the template's first "## " heading.
            const MARKER = '<!-- callisto-pr-template -->';
            const firstHeading = (template.split('\n').find((l) => l.startsWith('## ')) || '').trim();
            const body = pr.body || '';
            if (body.includes(MARKER) || (firstHeading && body.includes(firstHeading))) {
              core.info('PR description already contains the template.');
              return;
            }

            const newBody = body.trim() ? `${body.trim()}\n\n---\n\n${template}` : template;
            await github.rest.pulls.update({
              ...context.repo, pull_number: pr.number, body: newBody,
            });
            core.info(`Added the PR template to #${pr.number}.`);